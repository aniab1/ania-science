name: Auto Generate Science Article

on:
  workflow_dispatch: # يتيح لك تشغيل السكربت يدوياً متى شئت بضغطة زر
  schedule:
    - cron: '0 0 * * 0' # يعمل تلقائياً كل أسبوع مقال جديد

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install google-generativeai

      - name: Run AI Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_article.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "الذكاء الاصطناعي يكتب مقالاً علمياً جديداً 🚀"
